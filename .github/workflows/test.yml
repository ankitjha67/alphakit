name: Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Cancel in-flight runs on the same branch when a new commit is pushed.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token for tests — read-only.
permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # Session 2L: one Windows job rather than a third row of the cross
        # product, which would take the matrix from 6 jobs to 9. Python 3.12
        # only, because the failure classes this leg exists to catch are
        # OS-specific rather than interpreter-specific.
        #
        # Rationale: the Session 2K-3.5 cache-sentinel bug existed precisely
        # because no Windows leg ran. Path() normalisation turned "/dev/null"
        # into "\dev\null", so the disable sentinel silently missed and the
        # cache stayed ON for Windows developers who expected it OFF. A
        # pre-enable audit for this leg then found a second instance of the
        # same class: discovery.load_config read config.yaml through a bare
        # open(), which is cp1252 on Windows, raising UnicodeDecodeError on 3
        # configs and silently mojibaking 40 more. Both are fixed; this leg
        # is what stops a third.
        #
        # verify-install stays Linux + macOS this session. Extending that
        # workflow is a separate change with its own 6-job cost.
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # We sync `dev` only (not `--all-extras`): the `rl` extra pulls
      # torch + CUDA which is multi-GB and not needed to test core,
      # bridges or the reference strategy. Phase 3 will introduce a
      # dedicated `ml` workflow that installs torch-cpu explicitly.
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest with coverage gate
        run: uv run pytest --cov=alphakit --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}-${{ matrix.os }}
          path: .coverage
          if-no-files-found: ignore
          retention-days: 7
